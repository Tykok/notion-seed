version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: notion-seed
    main: .
    binary: notion-seed
    # No C dependency: a static binary runs on a distroless or Alpine image,
    # where users' CI runs.
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      # cli.Version is "0.0.0-dev" by default: without this injection, a
      # published binary would announce a version that does not exist.
      - -s -w -X github.com/tykok/notion-seed/cli.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

homebrew_casks:
  - name: notion-seed
    binaries: [notion-seed]
    repository:
      owner: tykok
      name: homebrew-tap
      branch: main
      # GITHUB_TOKEN is valid only for the current repository: pushing the
      # formula to the tap needs a token that covers the other repository.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/tykok/notion-seed
    description: Declares the structure of a Notion workspace and refuses destructive changes
    # custom_block rather than `hooks`, which emits `postflight`: Homebrew
    # deprecates it and warns on every install, twice, inviting the user to
    # open an issue here.
    #
    # postflight_steps is not a rename: it is a restricted declarative DSL,
    # without system_command. Hence `run`, and `chdir: "."` — its default base
    # path is already staged_path, whereas `chdir: :staged_path` is taken as a
    # literal path.
    custom_block: |
      postflight_steps do
        on_macos do
          # The binary is not notarized: without this macOS quarantines it and
          # refuses to run it, with a message about an unverified developer
          # rather than about quarantine.
          run "/usr/bin/xattr",
              args:  ["-dr", "com.apple.quarantine", "notion-seed"],
              chdir: "."
        end
      end

nfpms:
  - id: packages
    package_name: notion-seed
    formats: [deb, rpm, apk]
    maintainer: Tykok <treportelie12@gmail.com>
    description: Declares the structure of a Notion workspace and refuses destructive changes
    homepage: https://github.com/tykok/notion-seed
    license: GPL-3.0-or-later
    # /usr/bin and not /usr/local/bin: a package managed by the package
    # manager belongs to the distribution's hierarchy, /usr/local being
    # reserved for what the administrator installs outside packages.
    bindir: /usr/bin

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  footer: |
    `notion-seed` delegates the calls to `ntn`, which is not bundled:
    `npm i -g ntn@0.22.11 && ntn login`.
