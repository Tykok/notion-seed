version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: notion-seed
    main: .
    binary: notion-seed
    # Aucune dépendance C : un binaire statique s'exécute sur une image
    # distroless ou une Alpine, là où la CI des utilisateurs tourne.
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      # cli.Version vaut "0.0.0-dev" par défaut : sans cette injection, un
      # binaire publié annoncerait une version qui n'existe pas.
      - -s -w -X github.com/tykok/notion-seed/cli.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

homebrew_casks:
  - name: notion-seed
    binaries: [notion-seed]
    repository:
      owner: tykok
      name: homebrew-tap
      branch: main
      # GITHUB_TOKEN ne vaut que pour le dépôt courant : pousser la formule
      # dans le tap demande un jeton qui porte sur l'autre dépôt.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/tykok/notion-seed
    description: Déclare la structure d'un workspace Notion et refuse les changements destructifs
    hooks:
      post:
        install: |
          # Le binaire n'est pas notarié : sans ça macOS le met en quarantaine
          # et refuse de l'exécuter, avec un message qui parle de développeur
          # non vérifié plutôt que de quarantaine.
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status.zero?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/notion-seed"]
          end

nfpms:
  - id: packages
    package_name: notion-seed
    formats: [deb, rpm, apk]
    maintainer: Tykok <treportelie12@gmail.com>
    description: Déclare la structure d'un workspace Notion et refuse les changements destructifs
    homepage: https://github.com/tykok/notion-seed
    license: GPL-3.0-or-later
    # /usr/bin et non /usr/local/bin : un paquet géré par le gestionnaire de
    # paquets appartient à la hiérarchie de la distribution, /usr/local étant
    # réservé à ce que l'administrateur installe hors paquet.
    bindir: /usr/bin

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  footer: |
    `notion-seed` délègue les appels à `ntn`, qui n'est pas embarqué :
    `npm i -g ntn@0.22.11 && ntn login`.
