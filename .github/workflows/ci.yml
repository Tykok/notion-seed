name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # The version comes from go.mod: a single source of truth, so the CI
          # never builds with a toolchain the repository does not require.
          go-version-file: go.mod

      # gofmt -l prints nothing when everything is formatted and never returns
      # a non-zero code: the test on its output is what fails the job.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: license headers
        run: ./scripts/check-spdx.sh

      # The repository now holds three workflows that publish on their own; a
      # faulty expression would only show up at release time.
      - name: actionlint
        uses: raven-actions/actionlint@v2

  # A dead link fails the VitePress build, so a PR cannot break the site.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: build the site
        working-directory: docs
        run: npm ci && npm run build
