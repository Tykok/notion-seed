name: apt repository

on:
  # Above all not `release: published`: GoReleaser creates the release with
  # GITHUB_TOKEN, and GitHub triggers no workflow from an event produced by
  # this token. The apt repository would never be published. release.yml
  # therefore calls this workflow directly.
  workflow_call:
    inputs:
      tag:
        description: Tag of the release to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to (re)publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # Two releases published back to back would rewrite the same apt index: the
  # second would start from a gh-pages the first has not pushed yet, and would
  # lose its packages. One at a time, without cancelling the previous one.
  group: apt-repo
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Debian tools
        run: sudo apt-get update -qq && sudo apt-get install -y dpkg-dev apt-utils

      - name: Download the release .deb files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p incoming
          gh release download "$TAG" --pattern '*.deb' --dir incoming

      - name: Import the signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "::error::secret APT_GPG_PRIVATE_KEY missing — apt rejects an unsigned apt repository"
            exit 1
          fi
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      - name: Carry over the packages already published
        run: |
          # Without this step, publishing a version would make all the
          # previous ones unfindable: the repository is rebuilt in full every
          # time, so it must start again from what is already online.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth 1 origin gh-pages
            mkdir -p pages
            git archive FETCH_HEAD | tar -x -C pages
            find pages/apt/pool -name '*.deb' -exec cp -n {} incoming/ \; 2>/dev/null || true
          fi
          ls -1 incoming/

      - name: Build the repository
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY_ID }}
        run: ./scripts/build-apt-repo.sh incoming apt-repo

      - name: Publish to gh-pages
        env:
          TAG: ${{ inputs.tag }}
        run: |
          rm -rf pages && mkdir pages && cd pages
          git init -q -b gh-pages
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth 1 origin gh-pages && git reset --soft FETCH_HEAD
          fi
          rm -rf apt
          cp -r ../apt-repo apt
          # Without this, GitHub Pages runs the content through Jekyll, which
          # ignores directories starting with an underscore and rewrites some
          # files.
          touch .nojekyll
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "apt: publier $TAG" || { echo "nothing to publish"; exit 0; }
          git push -q origin gh-pages
