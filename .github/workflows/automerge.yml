name: Dependabot auto-merge

# A Dependabot PR is not judged by reading it: what human review would bring
# here, the CI already says. So we merge on green, and keep review for the
# changes someone wrote.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    # workflow_run also fires for pushes on main and for red CI runs: the three
    # conditions narrow the job down to green Dependabot PRs.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: merge the green PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # workflow_run does not carry the PR number: we find it from the
          # branch. The `dependabot/` prefix is a naming convention anyone can
          # reuse; the author, however, cannot be forged, so it is what
          # decides.
          number=$(gh api "repos/${REPO}/pulls" \
            -X GET -f state=open -f "head=${REPO%%/*}:${BRANCH}" \
            --jq '.[] | select(.user.login == "dependabot[bot]") | .number')

          if [ -z "$number" ]; then
            echo "no open Dependabot PR on ${BRANCH}: nothing to merge."
            exit 0
          fi

          # --match-head-commit refuses the merge if the branch moved since:
          # without it, a Dependabot rebase landing between the end of the CI
          # and this job would merge code nothing has tested.
          gh pr merge "$number" --squash --match-head-commit "$SHA"
