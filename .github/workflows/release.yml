name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser builds the changelog from the history: a shallow
          # checkout would make it empty or wrong.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN covers only this repository: pushing the cask to
          # tykok/homebrew-tap needs a token that covers the other repository.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  apt:
    # In the same run as the release: the apt repository is republished on
    # every tag without depending on an event GITHUB_TOKEN cannot trigger.
    needs: goreleaser
    uses: ./.github/workflows/apt.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
