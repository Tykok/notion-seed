name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser construit le changelog depuis l'historique : une
          # checkout peu profonde le rendrait vide ou faux.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN ne porte que sur ce dépôt : pousser le cask dans
          # tykok/homebrew-tap demande un jeton qui porte sur l'autre dépôt.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  apt:
    # Dans le même run que la release : le dépôt apt se republie à chaque tag
    # sans dépendre d'un événement que GITHUB_TOKEN ne peut pas déclencher.
    needs: goreleaser
    uses: ./.github/workflows/apt.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
